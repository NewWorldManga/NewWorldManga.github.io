name: Deploy MangaGoAtlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website from ZIP
        run: |
          set -euo pipefail
          test -f "MangaGoAtlas-Site-No-Chapters (5).zip"
          rm -rf /tmp/mangago-src _site
          mkdir -p /tmp/mangago-src _site
          unzip -q "MangaGoAtlas-Site-No-Chapters (5).zip" -d /tmp/mangago-src

          if [ -f /tmp/mangago-src/MangaGoAtlas/index.html ]; then
            cp -a /tmp/mangago-src/MangaGoAtlas/. _site/
          elif [ -f /tmp/mangago-src/index.html ]; then
            cp -a /tmp/mangago-src/. _site/
          else
            index_file="$(find /tmp/mangago-src -mindepth 2 -maxdepth 4 -type f -name index.html ! -path '*/admin/*' -print -quit)"
            if [ -z "$index_file" ]; then
              echo "Could not find the website's main index.html in the ZIP."
              find /tmp/mangago-src -maxdepth 4 -type f | head -100
              exit 1
            fi
            cp -a "$(dirname "$index_file")/." _site/
          fi

          touch _site/.nojekyll
          test -f _site/index.html
          echo "Website files prepared:"
          find _site -maxdepth 2 -type f | head -80

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
