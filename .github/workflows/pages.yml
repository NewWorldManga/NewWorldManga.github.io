name: Deploy NEWMANGAWORLD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website from repository root
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # The live website is maintained at the repository root.
          # Do not publish the old extracted source folder or the ZIP archive.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='extracted' \
            --exclude='MangaGoAtlas-Site-No-Chapters (5).zip' \
            ./ _site/

          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/homepage-system.js
          test -f _site/data/content.json
          echo "Root homepage and assets ready:"
          ls -la _site
          find _site -maxdepth 2 -type f | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
